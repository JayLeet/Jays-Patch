services:
  mc:
    # Tested image. Update this digest intentionally after startup and gameplay checks.
    image: itzg/minecraft-server@sha256:2515a051e7da13a29e0501eef78dcd42e2d9de1f4cfdde6f360ee977f6557cd5
    container_name: botc-minecraft
    tty: true
    stdin_open: true

    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"

    environment:
      EULA: "TRUE"

      MODPACK_PLATFORM: "MODRINTH"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/blood-on-the-clocktower/version/1.5.4"
      VERSION: "1.21.10"

      MEMORY: "6144M"
      MAX_PLAYERS: "25"
      ENABLE_COMMAND_BLOCK: "true"
      USE_AIKAR_FLAGS: "true"

      MODRINTH_FORCE_INCLUDE_FILES: |
        spiffyhud
        fancymenu
        konkrete
        melody

      MODRINTH_PROJECTS: |
        fabric:fancymenu:3.8.2-1.21.10-fabric
        fabric:advanced-chat:1.8.2-1.21.9

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_FORCE_SYNCHRONIZE: "false"
      MODRINTH_OVERRIDES_EXCLUSIONS: |
        config/voicechat/voicechat-server.properties
        server/config/voicechat/voicechat-server.properties
        config/melius-commands/commands/botc.json
        config/melius-commands/commands/character.json
        config/melius-commands/commands/request_chat.json
        config/melius-commands/commands/settings.json
        config/melius-commands/commands/setupbag.json
        config/melius-commands/commands/st.json
        config/melius-commands/commands/tpallhome.json
        config/melius-commands/commands/tpchurch.json
        resources/datapack/required/Jays-Patch
        resources/resourcepack/required/Jays-Patch

      ENABLE_RCON: "true"
    volumes:
      - ./data:/data
