# Copy this file to local-settings.properties and edit it for your machine.

# Set this to true if you want BOTC.exe to open Docker Desktop automatically
# when Docker is installed but not running yet.
BOTC_MANAGE_DOCKER=true
BOTC_DOCKER_START_TIMEOUT_SECONDS=180

# Optional: only use this if Docker Desktop is installed somewhere unusual.
# Leave blank for the normal Windows install path.
BOTC_DOCKER_DESKTOP_EXE=

# Set this to true if you use the Windows playit.gg service and want Start.bat
# to start/stop it with the Minecraft server.
BOTC_MANAGE_PLAYIT=false
BOTC_PLAYIT_SERVICE=playitd

# Simple Voice Chat:
# If you use playit.gg, create an MC: Simple Voice Chat tunnel that points to
# local UDP port 24454, then put the public playit host:port below.
# Example: BOTC_VOICE_HOST=example.playit.gg:12345
BOTC_VOICE_HOST=
BOTC_VOICE_PORT=24454
BOTC_VOICE_BIND_ADDRESS=*

# Jay's Patch role icons:
# The grimoire reveal icons require this small client resource pack.
# Override this only if you rehost the same generated zip somewhere else.
BOTC_RESOURCE_PACK_URL=https://download.mc-packs.net/pack/8b79575eeabb9e6dbb7dbd4554b4d36331ca99de.zip
